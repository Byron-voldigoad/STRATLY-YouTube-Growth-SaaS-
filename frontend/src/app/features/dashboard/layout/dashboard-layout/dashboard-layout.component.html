<div class="flex h-screen bg-zinc-950 font-sans text-zinc-50 selection:bg-violet-500/30 overflow-hidden">
  <div *ngIf="isMobile && sidebarOpen" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-20" (click)="toggleSidebar()"></div>

  <!-- Sidebar -->
  <aside
    class="bg-zinc-900 border-r border-zinc-800 flex flex-col transition-all duration-300 fixed inset-y-0 left-0 z-30 lg:relative lg:z-auto"
    [class.w-72]="sidebarOpen" [class.w-20]="!isMobile && !sidebarOpen"
    [class.-translate-x-full]="isMobile && !sidebarOpen" [class.translate-x-0]="isMobile && sidebarOpen">
    <!-- Logo -->
    <div class="h-20 flex items-center justify-center px-4 border-b border-zinc-800 bg-transparent relative">
      @if (sidebarOpen) {
      <div class="flex items-center gap-3 w-full px-2">
        <img src="/assets/images/nerra_dark.png" alt="Nerra" class="h-8 w-auto" />
        <h1 class="text-2xl font-black text-zinc-50 tracking-tight">
          Nerra
        </h1>
      </div>
      } @else {
      <img src="/assets/images/nerra_dark.png" alt="Nerra" class="h-8 w-auto transition-transform hover:scale-110" />
      }
    </div>

    <!-- Navigation -->
    <nav class="flex-1 py-6 px-3 space-y-2 overflow-y-auto">
      @for (item of navItems; track item.path) {
      <a [routerLink]="item.disabled ? null : item.path"
        routerLinkActive="bg-zinc-800 text-zinc-50" #rla="routerLinkActive"
        [routerLinkActiveOptions]="{ exact: item.exact }"
        class="flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-bold transition-all group relative overflow-hidden"
        [ngClass]="{
          'text-zinc-500': item.disabled || !rla.isActive,
          'hover:bg-zinc-800/50 hover:text-zinc-50': !item.disabled && !rla.isActive,
          'opacity-50 pointer-events-none': item.disabled
        }">

        <ng-icon [name]="item.icon"
          class="w-5 h-5 flex-shrink-0 relative z-10 transition-transform group-hover:scale-110"></ng-icon>

        @if (sidebarOpen) {
        <span class="relative z-10">{{ item.label }}</span>
        }
      </a>
      }
    </nav>

    <!-- Bottom Actions -->
    <div class="p-3 border-t border-zinc-800 space-y-2">
      <button (click)="toggleNicheDetector()"
        class="flex items-center gap-3 w-full px-3 py-3 rounded-xl text-sm font-bold transition-all group" [ngClass]="
          nicheDetectorOpen
            ? 'bg-zinc-800 text-zinc-50'
            : 'text-zinc-500 hover:bg-zinc-800/50 hover:text-zinc-50'
        ">
        <ng-icon name="lucideTarget" class="w-5 h-5 flex-shrink-0 group-hover:rotate-12 transition-transform"></ng-icon>
        @if (sidebarOpen) {
        <span>Niche Detector</span>
        }
      </button>
      <button (click)="handleSignOut()"
        class="flex items-center gap-3 w-full px-3 py-3 rounded-xl text-sm font-bold text-zinc-500 hover:bg-rose-500/10 hover:text-rose-400 transition-all group">
        <ng-icon name="lucideLogOut"
          class="w-5 h-5 flex-shrink-0 group-hover:-translate-x-1 transition-transform"></ng-icon>
        @if (sidebarOpen) {
        <span>Déconnexion</span>
        }
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col h-screen overflow-hidden relative bg-zinc-950">

    <!-- Header -->
    <header
      class="h-20 bg-zinc-950/80 backdrop-blur-md border-b border-zinc-800 flex items-center justify-between px-8 shrink-0 z-10 transition-all">
      <div class="flex items-center gap-4">
        <button (click)="toggleSidebar()"
          class="p-2.5 rounded-xl hover:bg-zinc-800 text-zinc-500 hover:text-zinc-50 transition-all flex items-center justify-center group focus:outline-none focus:ring-2 focus:ring-violet-500/20">
          <ng-icon name="lucideMenu" class="w-5 h-5 group-hover:scale-110 transition-transform"></ng-icon>
        </button>
        <div class="hidden sm:block">
          <span class="text-sm font-bold text-zinc-50 tracking-tight">{{
            getPageTitle()
            }}</span>
        </div>
      </div>

      <div class="flex items-center gap-5">
        <div class="h-8 w-px bg-zinc-800"></div>

        <div class="flex items-center gap-3 cursor-pointer group">
          <div class="flex flex-col items-end hidden sm:flex">
            <span class="text-sm font-bold text-zinc-50 group-hover:text-zinc-300 transition-colors">Créateur
              Nerra</span>
            <span class="text-xs font-semibold text-zinc-500">Pro Plan</span>
          </div>
          <div
            class="w-10 h-10 bg-zinc-800 border border-zinc-700 rounded-xl flex items-center justify-center transform group-hover:scale-105 transition-all">
            <span class="text-zinc-300 text-sm font-black">CS</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="flex-1 overflow-y-auto p-4 md:p-8 relative">
      <div class="max-w-7xl mx-auto h-full">
        <router-outlet />
      </div>
    </main>
  </div>
</div>

<!-- Niche Detector Panel -->
@if (nicheDetectorOpen) {
<app-niche-detector (close)="nicheDetectorOpen = false"></app-niche-detector>
}
